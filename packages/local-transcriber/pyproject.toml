[project]
name = "local-transcriber"
version = "0.2.0"
description = "Atomic local whisper.cpp transcription with timestamped artifacts"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
local-transcribe = "local_transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcriber"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
