[project]
name = "podcast-digest"
version = "0.4.1"
description = "Follow podcasts and YouTube, transcribe locally with whisper.cpp, email an LLM-written summary of every new episode."
readme = "README.md"
license = "MIT"
authors = [{ name = "benjamin-di" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    # Floor kept current deliberately: YouTube breaks older releases every few
    # weeks (media fetch 403s while format resolution still succeeds), and the
    # image resolves this at build time via `pip install -e .` — uv.lock is not
    # used there. Raise this floor when YouTube ingestion rots again.
    "yt-dlp>=2026.8.19",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # Server-side HTML sanitizer for the model-generated summary before it goes
    # into the email body (nh3 = maintained Rust `ammonia` binding; ships
    # manylinux/musllinux wheels). See sanitize.py.
    "nh3>=0.2.17",
]

[project.urls]
Homepage = "https://github.com/benjamin-di/podcast-digest"
Issues = "https://github.com/benjamin-di/podcast-digest/issues"

[dependency-groups]
# The bundled transcriber (packages/local-transcriber) is a uv workspace member,
# not a PyPI project. It is listed here rather than in [project.dependencies]
# so that `pip install .` never looks that name up on PyPI. Without uv, install
# it from the repository first: `pip install ./packages/local-transcriber .`.
dev = ["local-transcriber"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/local-transcriber"]

[tool.uv.sources]
local-transcriber = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_digest", "src/podcast_digest_mcp"]

[project.scripts]
podcast-digest = "podcast_digest.__main__:main"
podcast-digest-mcp = "podcast_digest_mcp.__main__:main"

[project.optional-dependencies]
test = [
    "mypy>=2.3",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.15",
]
mcp = [
    "fastmcp>=4.0.10,<5",
    "tomlkit>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/local-transcriber/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # long lines are fine in prompts, SQL, comments
    "E702",  # column-builder pattern in db.py uses `x; y` for symmetry
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
